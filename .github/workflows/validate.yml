name: Validate and refresh catalogue
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run data:update && npm run images:sync && npm run data:verify
      - run: npm test && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-favorites-static
          path: |
            dist/
            public/data/
